<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geechee.World | Charleston Streetwear</title>

<meta name="description"
content="Shop Geechee.World — Charleston streetwear, TRUCHARLESTAFARIAN, Port City Hustlers Club, hats, hoodies, sneakers and Lowcountry gear.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --black:#070707;
  --black2:#101010;
  --black3:#171717;
  --gold:#d6ae45;
  --gold2:#f0cf73;
  --white:#ffffff;
  --gray:#aaa;
  --green:#0b8c4a;
  --red:#b91d27;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--black);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.5;
}

/* TOP BAR */
.topbar{
  background:var(--gold);
  color:#000;
  text-align:center;
  padding:8px 10px;
  font-weight:900;
  font-size:12px;
  letter-spacing:1px;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(7,7,7,.96);
  border-bottom:1px solid #292929;
  backdrop-filter:blur(12px);
}

.nav{
  max-width:1300px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
}

.logo{
  text-decoration:none;
  color:white;
  font-size:22px;
  font-weight:1000;
  letter-spacing:1px;
}

.logo span{
  color:var(--gold);
}

.nav-right{
  display:flex;
  gap:8px;
}

.nav-btn{
  color:white;
  background:#181818;
  border:1px solid #333;
  text-decoration:none;
  padding:9px 13px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
}

.nav-btn:hover{
  border-color:var(--gold);
  color:var(--gold);
}

/* HERO */
.hero{
  min-height:72vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:70px 20px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 25%,rgba(185,29,39,.28),transparent 28%),
    radial-gradient(circle at 80% 30%,rgba(11,140,74,.25),transparent 30%),
    radial-gradient(circle at 50% 90%,rgba(214,174,69,.20),transparent 36%),
    linear-gradient(145deg,#050505,#151515);
}

.hero:before{
  content:"843";
  position:absolute;
  font-size:45vw;
  font-weight:1000;
  color:rgba(255,255,255,.015);
  line-height:1;
}

.hero-inner{
  position:relative;
  z-index:2;
  max-width:900px;
}

.eyebrow{
  display:inline-block;
  border:1px solid var(--gold);
  color:var(--gold);
  border-radius:30px;
  padding:6px 14px;
  font-size:11px;
  letter-spacing:2px;
  font-weight:900;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(46px,10vw,104px);
  line-height:.9;
  text-transform:uppercase;
  font-weight:1000;
  letter-spacing:-4px;
}

.hero h1 span{
  color:var(--gold);
}

.hero p{
  max-width:680px;
  margin:22px auto;
  color:#ccc;
  font-size:16px;
}

.hero-buttons{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
}

.big-btn{
  padding:14px 22px;
  border-radius:5px;
  text-decoration:none;
  font-weight:1000;
  font-size:13px;
  letter-spacing:.6px;
}

.primary{
  background:var(--gold);
  color:#000;
}

.secondary{
  border:1px solid #555;
  color:#fff;
  background:#111;
}

/* BRAND STRIP */
.brand-strip{
  border-top:1px solid #222;
  border-bottom:1px solid #222;
  background:#0d0d0d;
  overflow:hidden;
}

.brand-scroll{
  display:flex;
  gap:45px;
  padding:15px 20px;
  justify-content:center;
  flex-wrap:wrap;
  color:#bdbdbd;
  font-weight:900;
  font-size:12px;
  letter-spacing:1px;
}

.brand-scroll strong{
  color:var(--gold);
}

/* CONTENT */
main{
  max-width:1350px;
  margin:auto;
  padding:45px 16px 80px;
}

.section-head{
  margin-bottom:25px;
}

.section-head small{
  color:var(--gold);
  font-weight:900;
  letter-spacing:2px;
}

.section-head h2{
  font-size:clamp(28px,6vw,48px);
  margin-top:4px;
}

/* SEARCH */
.tools{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:13px;
  margin-bottom:28px;
}

.search{
  flex:1;
  min-width:220px;
  border:1px solid #333;
  background:#111;
  color:white;
  padding:14px 16px;
  border-radius:7px;
  outline:none;
  font-size:15px;
}

.search:focus{
  border-color:var(--gold);
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.filter{
  background:#141414;
  border:1px solid #333;
  color:#ddd;
  padding:10px 13px;
  border-radius:20px;
  cursor:pointer;
  font-weight:800;
  font-size:11px;
}

.filter.active,
.filter:hover{
  background:var(--gold);
  border-color:var(--gold);
  color:black;
}

.grid{

  grid
